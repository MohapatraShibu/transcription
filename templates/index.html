<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Speech to Text</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #f5f7fa; color: #1a1a2e; min-height: 100vh; }

    header { background: #ffffff; padding: 1.2rem 2rem; border-bottom: 1px solid #e0e4ea; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
    header h1 { font-size: 1.4rem; color: #2563eb; font-weight: 700; }
    header p { font-size: 0.82rem; color: #6b7280; margin-top: 3px; }

    .container { max-width: 860px; margin: 2rem auto; padding: 0 1.2rem; }

    .card { background: #ffffff; border-radius: 12px; padding: 1.6rem; margin-bottom: 1.4rem; border: 1px solid #e0e4ea; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
    .card h2 { font-size: 0.78rem; color: #9ca3af; margin-bottom: 1.2rem; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; }

    .record-area { text-align: center; padding: 0.5rem 0; }
    #recordBtn {
      width: 84px; height: 84px; border-radius: 50%; border: none; cursor: pointer;
      background: #2563eb; font-size: 1.9rem; transition: all 0.2s; color: #fff;
      box-shadow: 0 4px 14px rgba(37,99,235,0.3);
    }
    #recordBtn.recording {
      background: #dc2626;
      box-shadow: 0 4px 14px rgba(220,38,38,0.35);
      animation: pulse 1.2s infinite;
    }
    #recordBtn:disabled { background: #d1d5db; cursor: not-allowed; animation: none; box-shadow: none; }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(220,38,38,0.4); }
      70% { box-shadow: 0 0 0 16px rgba(220,38,38,0); }
      100% { box-shadow: 0 0 0 0 rgba(220,38,38,0); }
    }

    #statusText { margin-top: 0.9rem; font-size: 0.88rem; color: #6b7280; }
    #timer { font-size: 1.1rem; color: #2563eb; margin-top: 0.3rem; font-weight: 600; }

    #resultBox {
      margin-top: 1.2rem; background: #f0f4ff; border-radius: 8px;
      padding: 1rem 1.2rem; min-height: 56px; font-size: 0.97rem; line-height: 1.7;
      border: 1px solid #c7d7fd; color: #1e3a8a; display: none; text-align: left;
    }
    #langBadge {
      display: inline-block; margin-top: 0.6rem; padding: 3px 12px;
      background: #dbeafe; border-radius: 20px; font-size: 0.74rem; color: #1d4ed8; font-weight: 500;
    }

    .history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    .history-header h2 { margin-bottom: 0; }
    #refreshBtn {
      background: #f3f4f6; border: 1px solid #e0e4ea; color: #6b7280;
      padding: 5px 14px; border-radius: 6px; cursor: pointer; font-size: 0.82rem;
    }
    #refreshBtn:hover { background: #e5e7eb; color: #374151; }

    .record-item {
      background: #fafafa; border-radius: 8px; padding: 1rem 1.1rem;
      margin-bottom: 0.75rem; border: 1px solid #e5e7eb;
    }
    .record-item-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.5rem; }
    .record-title { font-weight: 600; color: #111827; font-size: 0.92rem; }
    .record-meta { font-size: 0.74rem; color: #9ca3af; margin-top: 3px; }
    .record-text { margin-top: 0.55rem; color: #374151; font-size: 0.9rem; line-height: 1.6; }
    .record-actions { display: flex; gap: 7px; flex-shrink: 0; }
    .btn-edit, .btn-delete {
      border: none; padding: 4px 12px; border-radius: 5px; cursor: pointer; font-size: 0.78rem; font-weight: 500;
    }
    .btn-edit { background: #dbeafe; color: #1d4ed8; }
    .btn-edit:hover { background: #bfdbfe; }
    .btn-delete { background: #fee2e2; color: #b91c1c; }
    .btn-delete:hover { background: #fecaca; }

    .modal-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.3);
      z-index: 100; align-items: center; justify-content: center;
    }
    .modal-overlay.active { display: flex; }
    .modal { background: #fff; border-radius: 12px; padding: 1.6rem; width: 90%; max-width: 480px; border: 1px solid #e0e4ea; box-shadow: 0 8px 30px rgba(0,0,0,0.1); }
    .modal h3 { margin-bottom: 1.1rem; color: #111827; font-size: 1rem; }
    .modal label { font-size: 0.82rem; color: #6b7280; display: block; margin-bottom: 4px; }
    .modal input, .modal textarea {
      width: 100%; background: #f9fafb; border: 1px solid #d1d5db; color: #111827;
      border-radius: 6px; padding: 8px 10px; font-size: 0.9rem; margin-bottom: 1rem;
    }
    .modal input:focus, .modal textarea:focus { outline: none; border-color: #2563eb; }
    .modal textarea { min-height: 100px; resize: vertical; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
    .btn-save { background: #2563eb; color: #fff; border: none; padding: 8px 18px; border-radius: 6px; cursor: pointer; font-size: 0.88rem; }
    .btn-save:hover { background: #1d4ed8; }
    .btn-cancel { background: #f3f4f6; color: #374151; border: 1px solid #d1d5db; padding: 8px 18px; border-radius: 6px; cursor: pointer; font-size: 0.88rem; }
    .btn-cancel:hover { background: #e5e7eb; }

    #emptyMsg { text-align: center; color: #9ca3af; padding: 2rem; font-size: 0.9rem; }
    .spinner {
      display: inline-block; width: 16px; height: 16px;
      border: 2px solid #d1d5db; border-top-color: #2563eb;
      border-radius: 50%; animation: spin 0.7s linear infinite;
      vertical-align: middle; margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <header>
    <h1>Speech to Text</h1>
    <p>multilingual real-time transcription</p>
  </header>

  <div class="container">
    <div class="card">
      <h2>record audio</h2>
      <div class="record-area">
        <button id="recordBtn" title="click to start recording">🎤</button>
        <div id="statusText">click the mic and start speaking</div>
        <div id="timer"></div>
        <div id="resultBox"></div>
        <span id="langBadge" style="display:none;"></span>
      </div>
    </div>

    <div class="card">
      <div class="history-header">
        <h2>transcription history</h2>
        <button id="refreshBtn">refresh</button>
      </div>
      <div id="historyList"><div id="emptyMsg">no transcriptions yet.</div></div>
    </div>
  </div>

  <div class="modal-overlay" id="editModal">
    <div class="modal">
      <h3>edit transcription</h3>
      <label>title</label>
      <input type="text" id="editTitle" />
      <label>text</label>
      <textarea id="editText"></textarea>
      <div class="modal-actions">
        <button class="btn-cancel" id="cancelEdit">cancel</button>
        <button class="btn-save" id="saveEdit">save</button>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
